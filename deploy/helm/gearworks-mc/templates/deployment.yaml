{{- if not .Values.cluster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gearworks-mc.fullname" . }}
  labels:
    {{- include "gearworks-mc.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gearworks-mc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gearworks-mc.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gearworks-mc.serviceAccountName" . }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: game
              containerPort: {{ .Values.server.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.server.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "gearworks-mc.fullname" . }}
          env:
            - name: DATABASE_URL
              value: {{ include "gearworks-mc.databaseURL" . | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: world-data
              mountPath: /data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: {{ include "gearworks-mc.fullname" . }}-world
      {{- end }}
{{- end }}
