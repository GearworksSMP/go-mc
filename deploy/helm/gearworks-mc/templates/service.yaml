apiVersion: v1
kind: Service
metadata:
  name: {{ include "gearworks-mc.fullname" . }}
  labels:
    {{- include "gearworks-mc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.port }}
      targetPort: game
      protocol: TCP
      name: game
    {{- if not .Values.cluster.enabled }}
    - port: {{ .Values.server.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- if .Values.cluster.enabled }}
    app.kubernetes.io/component: proxy
    {{- end }}
    {{- include "gearworks-mc.selectorLabels" . | nindent 4 }}
